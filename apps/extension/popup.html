<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="popup.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="popup-container">
        <div class="setting">
            <input type="checkbox" id="hide-shorts-homepage">
            <label for="hide-shorts-homepage">Hide homepage shorts</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="hide-shorts-search">
            <label for="hide-shorts-search">Hide shorts from search results</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="hide-recommendations">
            <label for="hide-recommendations">Hide recommendations</label>
        </div>
        
    </div>
</body>
</html>
